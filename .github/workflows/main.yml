name: Sincronizador Automático
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  sync-job:
    runs-on: ubuntu-latest
    steps:
      - name: Descargando código
        uses: actions/checkout@v3

      - name: Instalando Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Buscar y ejecutar sync.js
        run: |
          # Este comando busca el archivo sync.js sin importar en qué carpeta esté
          FILE_PATH=$(find . -name "sync.js" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$FILE_PATH" ]; then
            echo "❌ ERROR: No se encontró el archivo sync.js en ningún lado"
            exit 1
          fi
          
          DIR_PATH=$(dirname "$FILE_PATH")
          echo "📂 Archivo encontrado en: $FILE_PATH"
          echo "📍 Entrando a la carpeta: $DIR_PATH"
          
          cd "$DIR_PATH"
          npm install
          node $(basename "$FILE_PATH")
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FINA_TOKEN: ${{ secrets.FINA_TOKEN }}
