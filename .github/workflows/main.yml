name: Sincronizador Automático
on:
  schedule:
    - cron: '0 * * * *' # Se ejecuta cada hora
  workflow_dispatch: # Permite ejecutarlo manualmente
jobs:
  sync-job:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargando código del repo
        uses: actions/checkout@v3

      - name: 2. Diagnóstico (Ver archivos)
        run: |
          echo "📍 Listando todos los archivos para encontrar el error:"
          ls -R

      - name: 3. Instalando Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 4. Localizar y Ejecutar Sincronización
        run: |
          # Buscamos el archivo sync.js ignorando node_modules
          FILE_PATH=$(find . -name "sync.js" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -z "$FILE_PATH" ]; then
            echo "❌ ERROR: No se encontró el archivo sync.js en el repositorio."
            exit 1
          fi
          
          # Obtenemos la carpeta donde está el archivo
          DIR_PATH=$(dirname "$FILE_PATH")
          echo "📂 Archivo encontrado en: $FILE_PATH"
          
          cd "$DIR_PATH"
          npm install
          node $(basename "$FILE_PATH")
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FINA_TOKEN: ${{ secrets.FINA_TOKEN }}
